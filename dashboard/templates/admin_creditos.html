<dialog class="credit-detail-dialog" id="creditDetailDialog" aria-labelledby="creditDetailName">
  <div class="credit-dialog-inner">
    <div class="credit-dialog-visual"><img id="creditDetailPhoto" alt=""><span class="credit-dialog-monogram" id="creditDetailInitials">YC</span></div>
    <div class="credit-dialog-content">
      <div class="credit-dialog-top">
        <div><span class="credits-eyebrow" id="creditDetailArea"></span><h2 id="creditDetailName"></h2><span class="credits-role" id="creditDetailRole"></span></div>
        <button class="credit-dialog-close" type="button" data-close-credit aria-label="Cerrar ficha"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
      </div>
      <p id="creditDetailDescription"></p>
      <div class="credit-dialog-stack"><span class="credits-stack-title">Stack principal</span><div class="credits-stack" id="creditDetailStack"></div></div>
    </div>
  </div>
</dialog>

<script>
  (function () {
    var dialog = document.getElementById('creditDetailDialog');
    if (!dialog) return;
    var name = document.getElementById('creditDetailName');
    var role = document.getElementById('creditDetailRole');
    var area = document.getElementById('creditDetailArea');
    var description = document.getElementById('creditDetailDescription');
    var stack = document.getElementById('creditDetailStack');
    var photo = document.getElementById('creditDetailPhoto');
    var initials = document.getElementById('creditDetailInitials');
    var photoStatus = document.getElementById('creditsPhotoStatus');
    var photoKeyPrefix = 'ferreelectri-credit-photo-';

    function applyPhoto(key, source) {
      var galleryImage = document.querySelector('[data-photo-image="' + key + '"]');
      if (galleryImage) {
        galleryImage.src = source;
        galleryImage.classList.add('is-loaded');
        galleryImage.closest('.credits-portrait').querySelector('.credits-monogram').hidden = true;
      }
    }

    document.querySelectorAll('[data-photo-input]').forEach(function (input) {
      var key = input.dataset.photoInput;
      var savedPhoto = localStorage.getItem(photoKeyPrefix + key);
      if (savedPhoto) applyPhoto(key, savedPhoto);
      input.addEventListener('change', function () {
        var file = input.files && input.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          photoStatus.textContent = 'Selecciona un archivo de imagen.';
          input.value = '';
          return;
        }
        var reader = new FileReader();
        reader.onload = function () {
          var sourceImage = new Image();
          sourceImage.onload = function () {
            var scale = Math.min(1, 1200 / Math.max(sourceImage.width, sourceImage.height));
            var canvas = document.createElement('canvas');
            canvas.width = Math.round(sourceImage.width * scale);
            canvas.height = Math.round(sourceImage.height * scale);
            canvas.getContext('2d').drawImage(sourceImage, 0, 0, canvas.width, canvas.height);
            var compressedPhoto = canvas.toDataURL('image/jpeg', .84);
            try {
              localStorage.setItem(photoKeyPrefix + key, compressedPhoto);
              applyPhoto(key, compressedPhoto);
              photoStatus.textContent = 'Foto agregada. Se conserva en este navegador.';
            } catch (error) {
              photoStatus.textContent = 'No se pudo guardar la foto en el almacenamiento del navegador.';
            }
          };
          sourceImage.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    });

    document.querySelectorAll('[data-credit-card]').forEach(function (card) {
      card.addEventListener('click', function () {
        name.textContent = card.dataset.name || '';
        role.textContent = card.dataset.role || '';
        area.textContent = card.dataset.area || '';
        description.textContent = card.dataset.description || '';
        stack.textContent = '';
        (card.dataset.stack || '').split('|').filter(Boolean).forEach(function (item) {
          var tag = document.createElement('span');
          tag.textContent = item;
          stack.appendChild(tag);
        });
        initials.textContent = card.dataset.initials || '';
        var cardPhoto = localStorage.getItem(photoKeyPrefix + card.closest('.credits-shard').querySelector('[data-photo-input]').dataset.photoInput);
        if (cardPhoto) photo.src = cardPhoto;
        else photo.removeAttribute('src');
        photo.classList.toggle('is-loaded', Boolean(cardPhoto));
        initials.hidden = Boolean(cardPhoto);
        dialog.style.setProperty('--dialog-accent', getComputedStyle(card.closest('.credits-shard')).getPropertyValue('--credit-accent'));
        dialog.showModal();
      });
    });
    dialog.querySelector('[data-close-credit]').addEventListener('click', function () { dialog.close(); });
    dialog.addEventListener('click', function (event) { if (event.target === dialog) dialog.close(); });
  }());
</script>
