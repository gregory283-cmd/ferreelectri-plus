{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
            background: #0f2027;
            overflow-x: hidden;
        }
        .animated-bg {
            position: fixed;
            width: 100vw;
            height: 100vh;
            top: 0; left: 0;
            z-index: 0;
            overflow: hidden;
            background: linear-gradient(120deg, #00b2ff, #21c8f6, #4fd1c5, #00b2ff 90%);
            background-size: 200% 200%;
            animation: bgMove 10s ease-in-out infinite alternate, hueMove 18s linear infinite alternate;
        }
        @keyframes bgMove {
            0% { background-position: 0% 50%;}
            50% { background-position: 100% 50%;}
            100% { background-position: 0% 50%;}
        }
        @keyframes hueMove {
            0% { filter: hue-rotate(0deg);}
            100% { filter: hue-rotate(80deg);}
        }
        .bubble {
            position: absolute;
            border-radius: 50%;
            opacity: 0.18;
            filter: blur(1.5px);
            animation: floatBubble 2.2s infinite alternate, spinBubble 6s linear infinite;
        }
        .bubble1 { width: 220px; height: 220px; background: #00b2ff; left: 6vw; top: 10vh; animation-delay: 0s;}
        .bubble2 { width: 140px; height: 140px; background: #1976d2; right: 12vw; top: 20vh; animation-delay: 1.5s;}
        .bubble3 { width: 110px; height: 110px; background: #4fd1c5; left: 18vw; bottom: 8vh; animation-delay: 2.5s;}
        .bubble4 { width: 180px; height: 180px; background: #e3f5ff; right: 20vw; bottom: 10vh; animation-delay: 3.5s;}
        .bubble5 { width: 90px; height: 90px; background: #00b2ff; left: 45vw; top: 60vh; animation-delay: 2s;}
        @keyframes floatBubble {
            0% { transform: translateY(0) scale(1);}
            100% { transform: translateY(-60px) scale(1.12);}
        }
        @keyframes spinBubble {
            0% { transform: rotate(0deg);}
            100% { transform: rotate(360deg);}
        }
        .registro-main {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            position: relative;
        }
        .registro-panel {
            display: flex;
            width: 100%;
            max-width: 1100px;
            min-height: 700px;
            height: 80vh;
            box-shadow: 0 8px 40px #00b2ff33;
            border-radius: 22px;
            overflow: hidden;
            background: transparent;
        }
        .info-panel {
            flex: 1.2;
            background: rgba(240,245,255,1); /* Fondo casi sólido, azul muy claro */
            backdrop-filter: blur(18px) saturate(1.2);
            box-shadow: 0 8px 40px #00b2ff22;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 38px;
            min-width: 420px;
            max-width: 600px;
            height: 100%;
            box-sizing: border-box;
            border-right: 1.5px solid #b3e6ff44;
            border-top: 1.5px solid #fff4;
            border-bottom: 1.5px solid #fff4;
        }
        .info-logo-box {
            width: 180px;
            margin-bottom: 38px;
            margin-left: -10px;
            background: #1976d2;
            border-radius: 18px;
            padding: 18px 32px;
            box-shadow: 0 4px 24px #009de044;
            display: block;
            position: relative;
            overflow: hidden;
            animation: floatLogo 2.2s ease-in-out infinite alternate;
        }
        .info-logo {
            width: 100%;
            display: block;
            position: relative;
            z-index: 1;
        }
        .info-logo-box::after {
            content: "";
            position: absolute;
            left: -60px;
            top: 50%;
            width: 60px;
            height: 8px;
            background: linear-gradient(90deg, #fffbe6 0%, #ffe066 60%, #fffbe6 100%);
            box-shadow: 0 0 18px 8px #ffe06688, 0 0 32px 16px #fffbe633;
            border-radius: 4px;
            opacity: 0.85;
            transform: translateY(-50%) skewX(-25deg);
            pointer-events: none;
            transition: left 0.5s cubic-bezier(.7,.04,.33,.97), opacity 0.3s;
            z-index: 2;
        }
        .info-logo-box:hover::after {
            left: 100%;
            opacity: 1;
        }
        @keyframes floatLogo {
            0%   { transform: translateY(0) scale(1);}
            50%  { transform: translateY(-18px) scale(1.04);}
            100% { transform: translateY(0) scale(1);}
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-40px);}
            to   { opacity: 1; transform: translateY(0);}
        }
        .info-title {
            color: #1976d2 !important;
            text-shadow: none !important;
            font-size: 2.2em;
            font-weight: bold;
            margin-bottom: 18px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: fadeInLeft 1.2s cubic-bezier(.7,.04,.33,.97);
        }
        .info-subtitle {
            color: #1976d2 !important;
            font-size: 1.18em;
            margin-bottom: 30px;
            animation: fadeInLeft 1.5s cubic-bezier(.7,.04,.33,.97);
        }
        .info-list {
            width: 100%;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            animation: fadeInLeft 1.8s cubic-bezier(.7,.04,.33,.97);
        }
        .info-list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(227,245,255,0.55);
            border-radius: 12px;
            padding: 12px 18px;
            color: #1976d2 !important;
            font-size: 1.08em;
            font-weight: 500;
            box-shadow: 0 2px 12px #009de022;
            backdrop-filter: blur(2px);
        }
        .info-list-item i {
            font-size: 1.25em;
            color: #009de0 !important;
            filter: none !important;
            animation: pulseIcon 2.5s infinite alternate;
        }
        @keyframes fadeInLeft {
            from { opacity: 0; transform: translateX(-60px);}
            to   { opacity: 1; transform: translateX(0);}
        }
        @keyframes pulseIcon {
            0% { text-shadow: 0 0 0 #00b2ff44;}
            100% { text-shadow: 0 0 18px #fff;}
        }
        .registro-card {
            flex: 1;
            background: #fff;
            border-radius: 0 22px 22px 0;
            padding: 38px 38px;
            max-width: 480px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .registro-title {
            color: #1996e6;
            font-weight: bold;
            font-size: 2.1em;
            text-align: center;
            margin-bottom: 28px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-shadow: 0 2px 18px #00b2ff33;
            animation: shineText 2.5s infinite alternate;
        }
        @keyframes shineText {
            0% { text-shadow: 0 2px 12px #009de055, 0 0 0 #fff0;}
            100% { text-shadow: 0 2px 18px #009de055, 0 0 24px #fff8;}
        }
        .registro-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 18px;
            max-width: 370px;
            margin: 0 auto;
        }
        .input-group {
            position: relative;
            width: 100%;
        }
        .input-group i {
            position: absolute;
            left: 18px;
            top: 14px;
            bottom: 0;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1996e6;
            font-size: 1.25em;
            opacity: 0.85;
            transition: color .2s;
            pointer-events: none;
        }
        .registro-form input {
            width: 100%;
            padding: 13px 14px 13px 48px;
            border-radius: 13px;
            border: none;
            background: rgba(227,245,255,0.82);
            font-size: 1.08em;
            transition: box-shadow .3s, background .3s;
            outline: none;
            box-sizing: border-box;
            box-shadow: 0 0 0 1.5px #c6dffc;
        }
        .registro-form input:focus {
            box-shadow: 0 0 0 2.5px #00b2ffcc;
            background: #fff;
        }
        .registro-form label {
            color: #1976d2;
            font-weight: 600;
            margin-bottom: 7px;
            font-size: 1.07em;
            display: block;
            letter-spacing: 0.1px;
        }
        .registro-btn {
            width: 100%;
            background: linear-gradient(90deg,#00b2ff,#009de0);
            color: #fff;
            font-weight: 700;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 1.18em;
            box-shadow: 0 2px 16px #00b2ff22;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
            transition: background .3s, transform .2s, box-shadow .3s;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }
        .registro-btn::before {
            content: "";
            position: absolute;
            left: -60%;
            top: 0;
            width: 60%;
            height: 100%;
            background: linear-gradient(120deg,rgba(255,255,255,0.25) 0%,rgba(255,255,255,0.05) 100%);
            transform: skewX(-25deg);
            transition: left .5s;
        }
        .registro-btn:hover::before {
            left: 110%;
        }
        .registro-btn:hover, .registro-btn:focus {
            background: linear-gradient(90deg,#009de0,#00b2ff);
            transform: scale(1.04);
            box-shadow: 0 8px 32px #00b2ff33;
        }
        .registro-link {
            margin-top: 28px;
            text-align: center;
            color: #1976d2;
            font-size: 1.08em;
            width: 100%;
        }
        .registro-link a {
            color: #009de0;
            font-weight: bold;
            text-decoration: none;
            transition: color .2s;
        }
        .registro-link a:hover {
            color: #1976d2;
            text-decoration: underline;
        }
        /* Alerta de éxito */
        #registro-alerta {
            display:none;
            position:fixed;
            top:30px;
            left:50%;
            transform:translateX(-50%);
            z-index:9999;
        }
        #registro-alerta > div {
            background: linear-gradient(90deg,#00b2ff,#009de0);
            color: #fff;
            padding: 22px 38px;
            border-radius: 16px;
            box-shadow: 0 8px 32px #00b2ff33;
            font-size: 1.25em;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 16px;
            animation: fadeInDownAlert 0.7s cubic-bezier(.7,.04,.33,.97);
        }
        @keyframes fadeInDownAlert {
            from { opacity: 0; transform: translateY(-60px) scale(0.95);}
            to   { opacity: 1; transform: translateY(0) scale(1);}
        }
        @keyframes popAlert {
            0% { transform: scale(0.2);}
            70% { transform: scale(1.25);}
            100% { transform: scale(1);}
        }
        @media (max-width: 1100px) {
            .registro-panel {
                flex-direction: column;
                align-items: stretch;
                max-width: 98vw;
                min-height: unset;
                height: auto;
            }
            .info-panel {
                border-radius: 22px 22px 0 0;
                min-width: unset;
                max-width: unset;
                width: 100%;
                padding: 32px 18px 24px 18px;
                margin-bottom: 0;
                align-items: center;
                text-align: center;
                height: auto;
            }
            .registro-card {
                border-radius: 0 0 22px 22px;
                max-width: 98vw;
                height: auto;
                padding: 24px 8vw;
            }
        }
        @media (max-width: 600px) {
            .registro-card { 
                padding: 14px 2vw 10px 2vw; 
                max-width: 98vw; 
            }
            .registro-title { font-size: 1.15em;}
            .registro-form input { font-size: 1em; padding: 11px 12px 11px 40px;}
            .info-panel { padding: 18px 2vw 10px 2vw;}
        }
        @keyframes fadeInDownAlert {
            from { opacity: 0; transform: translateY(-60px) scale(0.95);}
            to   { opacity: 1; transform: translateY(0) scale(1);}
        }
        @keyframes popAlert {
            0% { transform: scale(0.2);}
            70% { transform: scale(1.25);}
            100% { transform: scale(1);}
        }
    </style>
</head>
<body>
<div class="animated-bg">
    <div class="bubble bubble1"></div>
    <div class="bubble bubble2"></div>
    <div class="bubble bubble3"></div>
    <div class="bubble bubble4"></div>
    <div class="bubble bubble5"></div>
</div>
<div class="registro-main">
    <div class="registro-panel">
        <div class="info-panel">
            <div class="info-logo-box">
                <img src="{% static 'img/logo.png' %}" alt="FerreElectri PLUS" class="info-logo">
            </div>
            <div class="info-title"><i class="fa-solid fa-user-shield"></i> ¡Crea tu cuenta!</div>
            <div class="info-subtitle">
                Regístrate para acceder a todas las funcionalidades de <b>FerreElectri PLUS</b>.
            </div>
            <div class="info-list">
                <div class="info-list-item"><i class="fa-solid fa-check-circle"></i> Proceso 100% seguro y confidencial</div>
                <div class="info-list-item"><i class="fa-solid fa-shield-halved"></i> Seguridad avanzada</div>
                <div class="info-list-item"><i class="fa-solid fa-bolt"></i> Rápido y fácil</div>
                <div class="info-list-item"><i class="fa-solid fa-headset"></i> Soporte personalizado</div>
            </div>
        </div>
        <div class="registro-card">
            <div class="registro-title"><i class="fa-solid fa-user-plus"></i> Crear una cuenta</div>
            <form class="registro-form" action="{% url 'registro' %}" method="post" autocomplete="off">
                {% csrf_token %}
                <div class="input-group">
                    <label for="username">Nombre de usuario</label>
                    <i class="fa-regular fa-user"></i>
                    <input type="text" id="username" name="username" placeholder="Nombre de usuario" required maxlength="40">
                </div>
                <div class="input-group">
                    <label for="email">Correo electrónico</label>
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="email" name="email" placeholder="Correo electrónico" required maxlength="65" autocomplete="username">
                </div>
                <div class="input-group">
                    <label for="password1">Contraseña</label>
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password1" name="password1" placeholder="Contraseña" required minlength="8" maxlength="40" autocomplete="new-password">
                </div>
                <div class="input-group">
                    <label for="password2">Repite la contraseña</label>
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password2" name="password2" placeholder="Repite la contraseña" required minlength="8" maxlength="40" autocomplete="new-password">
                </div>
                <button type="submit" class="registro-btn"><i class="fa-solid fa-user-check"></i> Registrarme</button>
            </form>
            <div class="registro-link">
                ¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
