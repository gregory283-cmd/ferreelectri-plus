<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b3150">
  <title>{{ title }} · FERREELECTRI PLUS</title>
  <style>
    :root { color-scheme: light; font-family: 'DM Sans', 'Segoe UI', sans-serif; background: #edf3f7; color: #183246; }
    * { box-sizing: border-box; }
    body { min-width: 0; min-height: 100vh; margin: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); }
    .toolbar { display: flex; min-height: 64px; align-items: center; justify-content: space-between; gap: 12px; padding: 10px clamp(12px, 3vw, 28px); background: #0b3150; color: #fff; }
    .title { min-width: 0; margin: 0; font-size: 1rem; line-height: 1.25; overflow-wrap: anywhere; }
    .actions { display: flex; flex: 0 0 auto; gap: 8px; }
    .action { display: inline-flex; min-height: 42px; align-items: center; justify-content: center; gap: 7px; border: 1px solid rgba(255,255,255,.24); border-radius: 8px; padding: 0 13px; background: rgba(255,255,255,.1); color: #fff; font: inherit; font-size: .86rem; font-weight: 700; text-decoration: none; }
    .action.primary { border-color: #42c8bf; background: #42c8bf; color: #082e49; }
    .preview { display: block; width: 100%; min-width: 0; height: 100%; border: 0; background: #fff; }
    @media (max-width: 560px) {
      .toolbar { min-height: 58px; gap: 8px; padding: 8px 10px; }
      .title { font-size: .86rem; }
      .actions { gap: 6px; }
      .action { min-height: 40px; padding: 0 9px; font-size: .76rem; }
      .action .label-long { display: none; }
      .preview { height: calc(100dvh - 58px); }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; } }
  </style>
</head>
<body>
  <header class="toolbar">
    <h1 class="title">{{ title }}</h1>
    <nav class="actions" aria-label="Acciones del reporte">
      <a class="action" href="{% url 'dashboard' %}" aria-label="Volver al panel"><span aria-hidden="true">←</span><span class="label-long">Volver</span></a>
      <a class="action primary" href="{{ download_url }}"><span aria-hidden="true">↓</span><span>Descargar</span></a>
    </nav>
  </header>
  <iframe class="preview" src="{{ preview_url }}" title="Vista previa de {{ title }}"></iframe>
</body>
</html>
